name: Daily Streak

on:
  schedule:
    # Every day at 12:54 AM Bangladesh time (18:54 UTC)
    - cron: '54 18 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configure Git
        env:
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$USER_EMAIL"

      - name: Create Empty Commit (Bangladesh Time)
        env:
          TZ: Asia/Dhaka
        run: |
          git commit --allow-empty -m "Daily Streak: $(date +'%Y-%m-%d %H:%M:%S %Z')"

      - name: Push to Main
        run: |
          git push origin HEAD:main
